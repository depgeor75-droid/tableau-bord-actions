<!doctype html>
<html lang="fr-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tableau de bord — Aedifica</title>
  <meta name="description" content="Tous les facteurs qui influencent le cours de l'action, avec leur évolution sur 1 mois, 1 an, 5 ans et 10 ans.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <!-- Sécurité : seuls les scripts du site et la bibliothèque de graphiques sont autorisés,
       et le navigateur ne peut contacter que ce site et l'API GitHub (bouton « Mettre à jour »). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23256abf'/%3E%3Cpath d='M12 44l12-14 10 8 18-22' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-initial.js"></script>
</head>
<body>
  <a class="evitement" href="#contenu">Aller au contenu</a>

  <header class="entete" id="entete">
    <div class="entete__ligne">
      <div class="entete__titre">
        <span class="entete__nom" id="nom-societe">Tableau de bord</span>
        <span class="entete__sous" id="sous-societe"></span>
      </div>
      <nav class="onglets onglets--haut" aria-label="Navigation principale" id="onglets-haut"></nav>
      <div class="entete__actions">
        <button class="etat" id="pastille" type="button" aria-haspopup="dialog">
          <span class="etat__point" aria-hidden="true"></span>
          <span class="etat__texte" id="pastille-texte">Chargement…</span>
        </button>
        <button class="bouton bouton--primaire" id="bouton-maj" type="button">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Mettre à jour</span>
        </button>
      </div>
    </div>
    <div class="progression" id="progression" hidden>
      <div class="progression__texte" id="progression-texte" role="status" aria-live="polite"></div>
      <div class="progression__piste"><div class="progression__barre" id="progression-barre"></div></div>
    </div>
  </header>

  <main id="contenu" class="contenu" tabindex="-1">
    <p class="chargement">Chargement des données…</p>
  </main>

  <footer class="pied">
    <p>Outil personnel d'information — pas un conseil en investissement.</p>
    <p class="pied__detail" id="pied-detail"></p>
  </footer>

  <nav class="onglets onglets--bas" aria-label="Navigation principale" id="onglets-bas"></nav>

  <div class="bulle" id="bulle" role="tooltip" hidden></div>
  <dialog class="feuille" id="feuille" aria-labelledby="feuille-titre"></dialog>
  <noscript><p class="chargement">Cette application a besoin de JavaScript pour afficher les données.</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"
          integrity="sha512-Y51n9mtKTVBh3Jbx5pZSJNDDMyY+yGe77DGtBPzRlgsf/YLCh13kSZ3JmfHGzYFCmOndraf0sQgfM654b7dJ3w=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
